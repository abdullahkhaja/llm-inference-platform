global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: llm-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:8000
        labels:
          component: fastapi
  - job_name: vllm
    metrics_path: /metrics
    static_configs:
      - targets:
          - vllm:8001
        labels:
          component: vllm
          vllm_version: "0.8.5"
