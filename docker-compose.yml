# Phase 1: FastAPI (mock) + Prometheus + Grafana — CPU only
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llm-api
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    environment:
      - BACKEND=mock
      - REQUEST_LOG_PATH=/app/logs/requests.jsonl
      - MOCK_PREFILL_MS=${MOCK_PREFILL_MS:-40}
      - MOCK_PER_TOKEN_MS=${MOCK_PER_TOKEN_MS:-12}
      - MOCK_JITTER_MS=${MOCK_JITTER_MS:-2}
      - MOCK_SEED=${MOCK_SEED:-42}
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: llm-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: llm-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped
